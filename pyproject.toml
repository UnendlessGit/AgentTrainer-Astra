[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrainer-astra"
version = "0.1.0"
description = "Local MLX computer-interaction learning runtime for AgentTrainer Astra"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx==0.32.2",
  "numpy==2.4.3",
  "safetensors==0.8.0",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"
